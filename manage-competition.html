<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý cuộc thi – Chính trị số</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    /* ===== HEADER ===== */
    header {
      background: #0d47a1;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
    }

    .user-email {
      margin-right: 12px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-add {
      background: #1976d2;
      color: #fff;
    }

    .btn-add:hover {
      background: #125ea8;
    }

    .btn-logout {
      background: #fff;
      color: #0d47a1;
    }

    /* ===== CONTENT ===== */
    .container {
      padding: 24px;
      max-width: 1200px;
      margin: auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #f0f3f7;
      font-weight: 600;
      color: #444;
      font-size: 15px;
    }

    tr:hover td {
      background: #f9fbfd;
    }

    .actions button {
      margin-right: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-edit {
      background: #1976d2;
      color: #fff;
    }

    .btn-delete {
      background: #d32f2f;
      color: #fff;
    }

    .competition-thumb {
      width: 90px;
      height: 56px;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
    }

    .status {
      font-weight: 600;
      text-transform: uppercase;
    }

    .status.active { color: #2e7d32; }
    .status.draft  { color: #f9a825; }
    .status.closed { color: #d32f2f; }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    #btnBack {
      background: #e0e0e0;
      color: #333;
    }
  </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <h1>🏆 Quản lý cuộc thi</h1>
  <div class="header-right">
    <span id="userEmail" class="user-email"></span>
    <button class="btn btn-logout" id="btnLogout">Đăng xuất</button>
  </div>
</header>

<!-- ===== CONTENT ===== -->
<div class="container">

  <div class="toolbar">
    <button class="btn" id="btnBack">⬅ Quay lại</button>
    <button class="btn btn-add" id="btnAdd">➕ Tạo cuộc thi</button>
  </div>

  
  <table>
    <thead>
      <tr>
        <th width="100">Ảnh</th>
        <th width="420">Tên cuộc thi</th>
        <th width="200">Bắt đầu</th>
        <th width="200">Kết thúc</th>
        <th width="120">Trạng thái</th>
        <th width="160">Hành động</th>
      </tr>
    </thead>
    <tbody id="competitionBody"></tbody>
  </table>

  <div class="empty" id="emptyMsg" style="display:none">
    Chưa có cuộc thi nào
  </div>
</div>

<!-- ===== SCRIPT ===== -->
<script type="module">
  import { requireAuth, logout } from "./js/auth.js";
  import { auth, db } from "./js/firebase.js";
  import { onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    collection,
    query,
    orderBy,
    getDocs,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  requireAuth();

  history.pushState({ page: "manage-competition" }, "", location.href);
  window.addEventListener("popstate", () => {
    location.replace("dashboard.html");
  });

  const userEmail = document.getElementById("userEmail");
  onAuthStateChanged(auth, user => {
    userEmail.textContent = user ? user.email : "";
  });

  document.getElementById("btnLogout").onclick = logout;
  document.getElementById("btnBack").onclick = () =>
    location.replace("dashboard.html");

  document.getElementById("btnAdd").onclick = () =>
    location.replace("post-competition.html");

  const bodyEl = document.getElementById("competitionBody");
  const emptyEl = document.getElementById("emptyMsg");

  function formatTime(ts) {
    if (!ts) return "";
    return ts.toDate().toLocaleString("vi-VN");
  }

  function getCompetitionStatus(startTime, endTime) {
  if (!startTime || !endTime) {
    return { text: "Không xác định", css: "draft" };
  }

  const now = new Date();
  const start = startTime.toDate();
  const end = endTime.toDate();

  if (now < start) {
    return { text: "Sắp diễn ra", css: "draft" };
  }

  if (now >= start && now <= end) {
    return { text: "Đang diễn ra", css: "active" };
  }

  return { text: "Đã kết thúc", css: "closed" };
}


  async function loadCompetition() {
    const q = query(
      collection(db, "competitions"),
      orderBy("created_at", "desc")
    );

    const snap = await getDocs(q);
    bodyEl.innerHTML = "";

    if (snap.empty) {
      emptyEl.style.display = "block";
      return;
    }

    emptyEl.style.display = "none";

    snap.forEach(docSnap => {
    const d = docSnap.data();

    const status = getCompetitionStatus(d.start_time, d.end_time);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        ${
          d.banner_url
            ? `<img src="${d.banner_url}" class="competition-thumb">`
            : ""
        }
      </td>
      <td>${d.title || ""}</td>
      <td>${formatTime(d.start_time)}</td>
      <td>${formatTime(d.end_time)}</td>
      <td class="status ${status.css}">
        ${status.text}
      </td>
      <td class="actions">
        <button class="btn btn-edit">Sửa</button>
        <button class="btn btn-delete">Xóa</button>
      </td>
    `;

    tr.querySelector(".btn-edit").onclick = () =>
      location.replace(`post-competition.html?id=${docSnap.id}`);

    tr.querySelector(".btn-delete").onclick = async () => {
      if (!confirm("Xóa cuộc thi này?")) return;
      await deleteDoc(doc(db, "competitions", docSnap.id));
      loadCompetition();
    };

    bodyEl.appendChild(tr);
  });

  }

  loadCompetition();
</script>

</body>
</html>
