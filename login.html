<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login – Chính trị số</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }

    .login-box h2 {
      margin: 0 0 6px;
      text-align: center;
      color: #0d47a1;
    }

    .login-box p {
      margin: 0 0 24px;
      text-align: center;
      color: #555;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #333;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1976d2;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #1976d2;
      color: #fff;
      font-weight: 600;
    }

    .btn-login:hover {
      background: #125ea8;
    }

    .loading {
      display: none;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    .error {
      display: none;
      margin-top: 14px;
      text-align: center;
      color: #d32f2f;
      font-size: 14px;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>🔐 Admin Login</h2>
    <p>
      Hệ thống quản trị nội dung<br>
      Ứng dụng <b>Chính trị số</b>
    </p>

    <div class="form-group">
      <label>Email quản trị</label>
      <input id="email" type="email" placeholder="admin@donvi.vn">
    </div>

    <div class="form-group">
      <label>Mật khẩu</label>
      <input id="password" type="password" placeholder="••••••••">
    </div>

    <button class="btn-login" id="btnLogin">Đăng nhập</button>

    <div class="loading" id="loading">Đang đăng nhập…</div>
    <div class="error" id="error"></div>

    <footer>© 2026 – Chính trị số</footer>
  </div>

  <!-- LOGIN SCRIPT -->
  <script type="module">
    import { blockLoginPage } from "./js/auth.js";
    blockLoginPage();

    import { auth, db } from "./js/firebase.js";
    import { signInWithEmailAndPassword } 
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc } 
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const emailEl   = document.getElementById("email");
    const passEl    = document.getElementById("password");
    const btnLogin  = document.getElementById("btnLogin");
    const loadingEl = document.getElementById("loading");
    const errorEl   = document.getElementById("error");

    btnLogin.addEventListener("click", async () => {
      errorEl.style.display = "none";
      loadingEl.style.display = "block";
      btnLogin.disabled = true;

      const email = emailEl.value.trim();
      const pass  = passEl.value;

      if (!email || !pass) {
        loadingEl.style.display = "none";
        btnLogin.disabled = false;
        errorEl.textContent = "Vui lòng nhập đầy đủ email và mật khẩu.";
        errorEl.style.display = "block";
        return;
      }

      try {
        const result = await signInWithEmailAndPassword(auth, email, pass);

        const ref = doc(db, "admins", result.user.uid);
        const snap = await getDoc(ref);

        if (!snap.exists() || snap.data().active !== true) {
          loadingEl.style.display = "none";
          btnLogin.disabled = false;
          errorEl.textContent = "Tài khoản không có quyền quản trị.";
          errorEl.style.display = "block";
          return;
        }

        location.replace("dashboard.html");

      } catch (e) {
        loadingEl.style.display = "none";
        btnLogin.disabled = false;
        errorEl.textContent = "Email hoặc mật khẩu không đúng.";
        errorEl.style.display = "block";
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") btnLogin.click();
    });


</script>


</body>
</html>
