<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý bài hát – Chính trị số</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    /* ===== HEADER ===== */
    header {
      background: #0d47a1;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
    }

    .user-email {
      margin-right: 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-add {
      background: #1976d2;
      color: #fff;
    }

    .btn-add:hover {
      background: #125ea8;
    }

    .btn-logout {
      background: #fff;
      color: #0d47a1;
    }

    /* ===== CONTENT ===== */
    .container {
      padding: 24px;
      max-width: 1100px;
      margin: auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f0f3f7;
      font-weight: 600;
      font-size: 16px;
    }

    tr:hover td {
      background: #f9fbfd;
    }

    .actions button {
      margin-right: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-edit {
      background: #1976d2;
      color: #fff;
    }

    .btn-delete {
      background: #d32f2f;
      color: #fff;
    }

    audio {
      width: 220px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    #btnBack {
      background: #e0e0e0;
      color: #333;
    }

    #btnBack:hover {
      background: #d5d5d5;
    }
  </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <h1>🎵 Quản lý bài hát quy định</h1>
  <div class="header-right">
    <span id="userEmail" class="user-email"></span>
    <button class="btn btn-logout" id="btnLogout">Đăng xuất</button>
  </div>
</header>

<!-- ===== CONTENT ===== -->
<div class="container">

  <!-- TOOLBAR -->
  <div class="toolbar">
    <button class="btn" id="btnBack">⬅ Quay lại</button>
    <button class="btn btn-add" id="btnAdd">➕ Thêm bài hát</button>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th width="420">Tên bài hát</th>
        <th width="220">Tác giả</th>
        <th width="260">Nghe thử</th>
        <th width="180">Hành động</th>
      </tr>
    </thead>
    <tbody id="songBody"></tbody>
  </table>

  <div class="empty" id="emptyMsg" style="display:none">
    Chưa có bài hát nào
  </div>
</div>

<!-- ===== SCRIPT ===== -->
<script type="module">
  import { requireAuth, logout } from "./js/auth.js";
  import { auth, db } from "./js/firebase.js";
  import { onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  import {
    collection,
    query,
    where,
    orderBy,
    getDocs,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  import { getFunctions, httpsCallable }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

  // 🔐 Bảo vệ trang
  requireAuth();

  history.pushState({ page: "manage-songs" }, "", location.href);
  window.addEventListener("popstate", () => {
    location.replace("dashboard.html");
  });

  // ===== USER EMAIL =====
  const userEmail = document.getElementById("userEmail");

  onAuthStateChanged(auth, (user) => {
    userEmail.textContent = user ? user.email : "";
  });

  document.getElementById("btnLogout").onclick = logout;

  // ➕ Thêm bài hát (trang khác)
  document.getElementById("btnAdd").onclick = () => {
    location.replace("post-song.html");
  };

  // ⬅ Back
  document.getElementById("btnBack").onclick = () => {
    location.replace("dashboard.html");
  };

  const bodyEl = document.getElementById("songBody");
  const emptyEl = document.getElementById("emptyMsg");

  // Cloud Function xóa Cloudinary (nếu có)
  const functions = getFunctions(undefined, "us-central1");
  const deleteCloudinaryAudios =
    httpsCallable(functions, "deleteCloudinaryAudios");

  async function loadSongs() {
    try {
      const q = query(
        collection(db, "songs"),
        orderBy("created_at", "desc")
      );

      const snap = await getDocs(q);
      bodyEl.innerHTML = "";

      if (snap.empty) {
        emptyEl.style.display = "block";
        return;
      }

      emptyEl.style.display = "none";

      snap.forEach(docSnap => {
        const s = docSnap.data();

        // 👉 LỌC CATEGORY BẰNG JS (AN TOÀN)
        if (s.category !== "quy_dinh") return;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${s.title || ""}</td>
          <td>${s.author || ""}</td>
          <td>
            ${
              s.audio_url
                ? `<audio controls src="${s.audio_url}"></audio>`
                : ""
            }
          </td>
          <td class="actions">
            <button class="btn btn-edit">Sửa</button>
            <button class="btn btn-delete">Xóa</button>
          </td>
        `;

        tr.querySelector(".btn-edit").onclick = () => {
          location.replace(`post-song.html?id=${docSnap.id}`);
        };

        tr
        tr.querySelector(".btn-delete").onclick = async () => {
          if (!confirm("Xóa bài hát này?")) return;

          try {
            if (s.audio_public_id) {
              await deleteCloudinaryAudios({
                public_ids: [s.audio_public_id]
              });
            }

            await deleteDoc(doc(db, "songs", docSnap.id));
            loadSongs();

          } catch (err) {
            console.error(err);
            alert("❌ Không thể xóa bài hát");
          }
        };

        bodyEl.appendChild(tr);
      });

      if (!bodyEl.children.length) {
        emptyEl.style.display = "block";
      }

    } catch (e) {
      console.error("Load songs error:", e);
      emptyEl.style.display = "block";
      emptyEl.textContent = "Không thể tải danh sách bài hát";
    }
  }


  loadSongs();
</script>

</body>
</html>
